<!DOCTYPE html>
<html lang="en">
  <head>
    <meta content="viewport" width="width=device-width, intitial-scale=1.0">
    <meta charset="utf-8">
    <title>Stats Preview Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/pmg" href="favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
  <div class="card">
    <div class="text-box">
      <p class="header">Get <span class="purple">insights </span>that help your business grow.</p>
      <p class="info">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
      <div class="stats">
        <div class="stack1">
          <p class="numbers">10k+</p>
          <p class="caps">COMPANIES</p>
        </div>
        <div class="stack2">
          <p class="numbers">314</p>
          <p class="caps">TEMPLATES</p>
        </div>
        <div class="stack3">
          <p class="numbers">12M+</p>
          <p class="caps">QUERIES</p>
        </div>
      </div>
    </div>
    <div class="image-box">
      
    </div>
  </div>
  </body>
